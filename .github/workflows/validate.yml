name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch cubecli releases that changed the commands
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest cubecli release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cubecli" && cd "$RUNNER_TEMP/cubecli"
          gh release download -R CubePathInc/cubecli -p 'cubecli_*_linux_amd64.tar.gz' -p checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          tar -xzf cubecli_*_linux_amd64.tar.gz
          ./cubecli version
          echo "$RUNNER_TEMP/cubecli" >> "$GITHUB_PATH"

      - name: Regenerate the command reference
        run: scripts/generate-reference.sh

      - name: Reference must be up to date
        run: |
          if ! git diff --exit-code -- plugins; then
            echo "::error::The vendored cubecli reference is stale. Run scripts/generate-reference.sh with the latest cubecli and commit."
            exit 1
          fi

      - name: Validate skills
        run: python3 scripts/validate.py
